<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>图书借阅管理系统</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%232563eb%22/><text x=%2232%22 y=%2243%22 text-anchor=%22middle%22 font-size=%2236%22 fill=%22white%22>L</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-mark">L</div>
      <h1>图书借阅管理系统</h1>
      <p>统一管理馆藏、读者和借阅流程</p>
      <form id="loginForm">
        <label>用户名<input id="username" value="admin" autocomplete="username" required></label>
        <label>密码<input id="password" type="password" value="admin123" autocomplete="current-password" required></label>
        <button type="submit" class="primary">登录</button>
      </form>
      <small>演示管理员：admin / admin123　演示读者：reader / reader123</small>
      <div id="loginError" class="error"></div>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside>
      <div class="brand"><span class="brand-mark small">L</span><div><strong>Library</strong><small>借阅管理系统</small></div></div>
      <nav id="nav">
        <button data-view="dashboard" class="active">概览</button>
        <button data-view="books">图书管理</button>
        <button data-view="readers" data-admin>读者管理</button>
        <button data-view="circulation">借阅流通</button>
        <button data-view="accounts" data-admin>账号权限</button>
        <button data-view="logs" data-admin>操作日志</button>
      </nav>
      <div class="user-box"><div><strong id="currentUser"></strong><small id="currentRole"></small></div><button id="logoutBtn">退出</button></div>
    </aside>
    <main>
      <header><div><h2 id="pageTitle">系统概览</h2><p id="pageSubtitle">查看图书馆当前运行状态</p></div><span id="clock"></span></header>
      <div id="notice"></div>

      <section id="dashboard" class="view active">
        <div id="stats" class="stats"></div>
        <div class="panel"><div class="panel-head"><h3>快速开始</h3></div><div class="quick-grid">
          <button data-go="books">查询馆藏<small>按书名或作者检索</small></button>
          <button data-go="circulation">办理借阅<small>借书、还书与续借</small></button>
          <button data-go="readers" data-admin>维护读者<small>读者资料及借阅规则</small></button>
        </div></div>
      </section>

      <section id="books" class="view">
        <div class="toolbar"><input id="bookKeyword" placeholder="搜索书名或作者"><button id="searchBooks">查询</button><button id="addBookBtn" class="primary" data-admin>新增图书</button></div>
        <div class="panel table-wrap"><table><thead><tr><th>ID</th><th>ISBN</th><th>书名</th><th>作者</th><th>分类</th><th>书架</th><th>可借/馆藏</th><th data-admin>操作</th></tr></thead><tbody id="bookRows"></tbody></table></div>
      </section>

      <section id="readers" class="view">
        <div class="toolbar"><button id="addReaderBtn" class="primary">新增读者</button><button id="addTypeBtn">配置读者类型</button></div>
        <div class="panel table-wrap"><table><thead><tr><th>ID</th><th>借阅证号</th><th>姓名</th><th>邮箱</th><th>类型</th><th>状态</th><th>操作</th></tr></thead><tbody id="readerRows"></tbody></table></div>
        <div class="panel table-wrap"><div class="panel-head"><h3>借阅规则</h3></div><table><thead><tr><th>ID</th><th>类型</th><th>最大借阅</th><th>借期</th><th>最大续借</th><th>日罚金</th></tr></thead><tbody id="typeRows"></tbody></table></div>
      </section>

      <section id="circulation" class="view">
        <div class="toolbar"><button id="borrowBtn" class="primary">办理借书</button><button id="reserveBtn">办理预约</button></div>
        <div class="panel table-wrap"><div class="panel-head"><h3>借阅记录</h3></div><table><thead><tr><th>ID</th><th>读者</th><th>图书</th><th>借出日期</th><th>应还日期</th><th>状态</th><th>罚金</th><th>操作</th></tr></thead><tbody id="loanRows"></tbody></table></div>
        <div class="panel table-wrap"><div class="panel-head"><h3>当前预约</h3></div><table><thead><tr><th>ID</th><th>读者</th><th>图书</th><th>预约时间</th><th>状态</th><th>操作</th></tr></thead><tbody id="reservationRows"></tbody></table></div>
        <div class="panel table-wrap" data-admin><div class="panel-head"><h3>催还记录</h3></div><table><thead><tr><th>ID</th><th>读者</th><th>图书</th><th>接收方</th><th>催还内容</th><th>时间</th></tr></thead><tbody id="reminderRows"></tbody></table></div>
      </section>

      <section id="accounts" class="view">
        <div class="toolbar"><button id="addAccountBtn" class="primary">新增账号</button></div>
        <div class="panel table-wrap"><table><thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>关联读者</th><th>状态</th><th>操作</th></tr></thead><tbody id="accountRows"></tbody></table></div>
      </section>

      <section id="logs" class="view">
        <div class="panel table-wrap"><table><thead><tr><th>时间</th><th>用户</th><th>方法</th><th>路径</th><th>状态码</th></tr></thead><tbody id="logRows"></tbody></table></div>
      </section>
    </main>
  </div>

  <dialog id="modal"><form id="modalForm"><div class="modal-head"><h3 id="modalTitle"></h3><button type="button" data-close-modal class="icon">×</button></div><div id="modalBody" class="form-grid"></div><div class="modal-actions"><button type="button" data-close-modal>取消</button><button id="modalSubmit" type="submit" class="primary">保存</button></div></form></dialog>
  <script src="app.js"></script>
</body>
</html>
