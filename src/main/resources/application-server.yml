spring:
  datasource:
    url: jdbc:h2:file:./data/library;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${DB_PASSWORD:library-change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
server:
  port: ${PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: ${CONTEXT_PATH:}
app:
  seed:
    admin-password: ${ADMIN_PASSWORD:admin123}
    reader-password: ${READER_PASSWORD:reader123}
