spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:library}
    password: ${DB_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: false
server:
  port: ${PORT:18080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    context-path: ${CONTEXT_PATH:/library}
app:
  seed:
    admin-password: ${ADMIN_PASSWORD:admin123}
    reader-password: ${READER_PASSWORD:reader123}
